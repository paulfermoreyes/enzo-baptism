name: CI Quality Gates

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Typecheck, Build & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck & production build
        run: npm run build

      - name: Dependency vulnerability audit (high/critical)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Verify Firestore security rules exist & are non-empty
        run: test -s firestore.rules && grep -q "rules_version" firestore.rules
